INGESTION:
  test_size: 0.30
  random_state: 42
  stratify: true

VALIDATION:
  drift_share_threshold: 0.5
  missing_rate: 0.20

TRANSFORMATION:
  scaler: standard
  encoder: onehot
  cat_imputer: most_frequent
  num_imputer: median
  imputer: knn
  n_neighbors: 5

MODEL_PARAMS:
  random_state: 42
  scoring: f1
  cv_folds: 5
  n_trials: 30
  n_jobs: 1

  XGBClassifier:
    n_estimators:
      low: 100
      high: 500
    max_depth:
      low: 3
      high: 10
    learning_rate:
      low: 0.01
      high: 0.3
      log: true
    subsample:
      low: 0.6
      high: 1.0
    colsample_bytree:
      low: 0.6
      high: 1.0
    gamma:
      low: 0.0
      high: 5.0
    min_child_weight:
      low: 1
      high: 10
    reg_alpha:
      low: 0.00000001
      high: 10.0
      log: true
    reg_lambda:
      low: 0.00000001
      high: 10.0
      log: true
    scale_pos_weight:
      low: 1.0
      high: 10.0

  CatBoostClassifier:
    iterations:
      low: 100
      high: 500
    depth:
      low: 4
      high: 10
    learning_rate:
      low: 0.01
      high: 0.3
      log: true
    l2_leaf_reg:
      low: 1.0
      high: 10.0
    random_strength:
      low: 0.0
      high: 5.0
    bagging_temperature:
      low: 0.0
      high: 5.0

  GradientBoostingClassifier:
    n_estimators:
      low: 50
      high: 300
    learning_rate:
      low: 0.01
      high: 0.3
      log: true
    max_depth:
      low: 2
      high: 8
    subsample:
      low: 0.6
      high: 1.0
    min_samples_split:
      low: 2
      high: 20
    min_samples_leaf:
      low: 1
      high: 10

  RandomForestClassifier:
    n_estimators:
      low: 100
      high: 500
    max_depth:
      low: 3
      high: 30
    min_samples_split:
      low: 2
      high: 20
    min_samples_leaf:
      low: 1
      high: 10
    max_features:
      choices:
        - sqrt
        - log2
    bootstrap: true
    class_weight: balanced

EVALUATION:
  model_evaluation_change_threshold: 0.7