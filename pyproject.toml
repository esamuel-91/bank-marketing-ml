[build-system]
requires = ['hatchling']
build-backend = 'hatchling.build'

[tool.hatch.build.targets.wheel]
packages = ['src']

[project]
name = "bank-marketing-ml"
version = "0.1.0"
description = "Machine Learning model to predict if the person will opt for term deposit or not? Based on X-features.. "
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "boto3>=1.44.11",
    "botocore>=1.44.11",
    "catboost>=1.2.10",
    "dvc>=3.67.1",
    "ensure>=1.0.4",
    "evidently>=0.7.23",
    "flask>=3.1.3",
    "from-root>=1.3.0",
    "jinja2>=3.1.6",
    "joblib>=1.6.0",
    "matplotlib>=3.11.2",
    "mlflow>=3.18.0",
    "nbformat>=5.11.1",
    "numpy>=1.26,<2.0",
    "optuna>=5.1.0",
    "pandas>=2.2,<3.1",
    "plotly>=5.24.1",
    "pymongo>=4.20.1",
    "python-box>=8.0.1",
    "pyyaml>=6.0.4",
    "scikit-learn>=1.9.1",
    "scipy>=1.15,<1.16",
    "seaborn>=0.13.2",
    "types-pyyaml>=6.0.12.20261122",
    "uvicorn>=0.54.0",
    "xgboost>=2.1,<3.0",
]

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "ruff>=0.17.6",
    "setuptools>=84.2.1",
]
