[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[project]
name = "bank-marketing-ml"
version = "0.1.0"
description = "ML project to predict if a person will opt for term deposit or not? based on X features"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "ensure>=1.0.4",
    "evidently>=0.7.23",
    "fastapi>=0.159.1",
    "from-root>=1.3.0",
    "jinja2>=3.1.6",
    "joblib>=1.6.0",
    "matplotlib>=3.11.2",
    "mlflow>=3.17.2",
    "numpy>=2.5.4",
    "pandas>=3.0.6",
    "plotly>=5.24.1",
    "pymongo>=4.19.0",
    "python-box>=7.4.1",
    "pyyaml>=6.0.3",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "seaborn>=0.13.2",
    "types-pyyaml>=6.0.12.20260906",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "ruff>=0.17.1",
    "setuptools>=84.2.1",
]
