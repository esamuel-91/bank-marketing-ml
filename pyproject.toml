[build-system]
requires = ['hatchling']
build-backend = 'hatchling.build'

[tool.hatch.build.targets.wheel]
packages = ['src']

[project]
name = "bank-marketing-ml"
version = "0.1.0"
description = "ML model to predict if the customer will opt for term deposit or not? Based on X features.."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "catboost>=1.2.10",
    "dvc>=3.67.1",
    "ensure>=1.0.4",
    "evidently>=0.7.23",
    "flask>=3.1.3",
    "from-root>=1.3.0",
    "jinja2>=3.1.6",
    "joblib>=1.6.0",
    "matplotlib>=3.11.2",
    "mlflow>=3.18.0",
    "nbformat>=5.11.1",
    "numpy>=2.5.4",
    "optuna>=5.0.0",
    "pandas<=3.1",
    "plotly>=5.24.1",
    "pymongo>=4.19.0",
    "python-box>=8.0.0",
    "pyyaml>=6.0.3",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "seaborn>=0.13.2",
    "types-pyyaml>=6.0.12.20261103",
    "uvicorn>=0.54.0",
    "xgboost>=3.4.1",
]

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "ruff>=0.17.4",
    "setuptools>=84.2.1",
]
